services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parqueadero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parqueadero}
      POSTGRES_DB: ${POSTGRES_DB:-parqueadero}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parqueadero}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Unica puerta de entrada del navegador: reparte cada ruta al microservicio que corresponde
  # (ver gateway/nginx.conf.template). Los servicios de atras no publican puerto al host.
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend-core
      - backend-parqueadero
      - backend-vision
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    volumes:
      - ./gateway/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro

  # No se publica un puerto al host: backend-vision solo es alcanzable a traves del gateway,
  # que exige sesion valida (no tiene credenciales de BD ni logica de negocio). Para depurar
  # localmente, agregar temporalmente `ports: ["8001:8001"]`.
  backend-vision:
    build: ./backend-vision
    restart: unless-stopped
    environment:
      CONFIANZA_MINIMA: ${CONFIANZA_MINIMA_ALPR:-0.5}

  # Base de datos propia del servicio de parqueadero: si se cae, identidad y accesos siguen
  # arriba (y al reves).
  db-parqueadero:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parqueadero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parqueadero}
      POSTGRES_DB: parqueadero_zonas
    ports:
      - "${PARQUEADERO_DB_PORT:-5434}:5432"
    volumes:
      - db_parqueadero_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parqueadero}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Zonas, espacios y cupos en tiempo real. Los demas servicios le piden ocupar/liberar cupos
  # por su API interna (/interno), que el gateway no publica.
  backend-parqueadero:
    build: ./backend-parqueadero
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload
    depends_on:
      db-parqueadero:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-parqueadero}:${POSTGRES_PASSWORD:-parqueadero}@db-parqueadero:5432/parqueadero_zonas
      SECRET_KEY: ${SECRET_KEY:-cambiar-esta-clave-en-produccion}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
    volumes:
      - ./backend-parqueadero:/code

  backend-core:
    build: ./backend-core
    restart: unless-stopped
    # --reload solo para desarrollo: como ./backend-core esta montado en /code, uvicorn reinicia
    # solo al guardar un .py. El CMD del Dockerfile (sin --reload) queda para produccion.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
      backend-vision:
        condition: service_started
      backend-parqueadero:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-parqueadero}:${POSTGRES_PASSWORD:-parqueadero}@db:5432/${POSTGRES_DB:-parqueadero}
      SECRET_KEY: ${SECRET_KEY:-cambiar-esta-clave-en-produccion}
      BACKEND_VISION_URL: http://backend-vision:8001
      PARQUEADERO_URL: http://backend-parqueadero:8002
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
      UPLOAD_DIR: /code/uploads
    volumes:
      - ./backend-core:/code
      # Documentos de verificacion (carnet, placa, tarjeta de propiedad): datos personales,
      # viven en un volumen propio y nunca se publican como estatico.
      - uploads_data:/code/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend-core
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000/ws/zonas}
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db_data:
  db_parqueadero_data:
  uploads_data:
